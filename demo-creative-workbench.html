<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Workbench · Aoxin Yang</title>
<style>
:root {
  font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  color: #22291f;
  background: #f6f1e5;
  --edge: #c7c5b4;
  --green: #315746;
  --muted: #51594b;
}
* { box-sizing: border-box; }
body, h1, h2, p { margin: 0; }
.wrap { width: min(1040px, calc(100% - 44px)); margin-inline: auto; }
.site { border-bottom: 1px solid var(--edge); }
.top { min-height: 61px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
a { color: var(--green); font-weight: 700; }
.top a { text-decoration: none; }
.top a:hover { text-decoration: underline; }
button, input, select { font: inherit; }
button, .download { cursor: pointer; }
:focus-visible { outline: 3px solid #a64821; outline-offset: 3px; }
button, select, input {
  border: 1px solid var(--edge); border-radius: 6px; background: #fffbf1;
  color: #22291f; padding: .55rem .75rem;
}
button:disabled { cursor: default; opacity: .55; }
button:not(:disabled):hover { border-color: var(--green); }
.intro { padding: 46px 0 32px; }
h1 { font-size: clamp(2.5rem, 7vw, 4.95rem); line-height: .98; letter-spacing: -.06em; }
:lang(zh-CN) h1 { letter-spacing: -.035em; }
.intro nav { display: flex; flex-wrap: wrap; gap: 12px 24px; margin-top: 20px; }
.work { border-top: 1px solid var(--edge); padding: 25px 0; scroll-margin-top: 15px; }
.heading { margin-bottom: 16px; }
h2 { font-size: clamp(1.55rem, 4vw, 2rem); line-height: 1.17; letter-spacing: -.03em; }
.heading p { color: var(--muted); margin-top: 8px; line-height: 1.48; }
.work-grid { display: grid; grid-template-columns: minmax(0, 1.8fr) minmax(220px, 1fr); align-items: start; gap: 16px; }
.map-surface, .poster-surface { min-width: 0; padding: 14px; border-radius: 10px; background: #e7e1d2; border: 1px solid var(--edge); }
.board { display: grid; grid-template-columns: repeat(6,minmax(0,1fr)); gap: 3px; }
.tile {
  border: 1px solid #424a3e35; border-radius: 3px; aspect-ratio: 1.3;
  display: grid; place-items: center; position: relative; padding: 0;
}
.tile:focus-visible { z-index: 1; }
.tile:hover { filter: brightness(.92); }
.ground { background: #dddcba; }
.water { background: #8fc5cf; }
.water::after { content: ""; width: 58%; height: 35%; background: repeating-linear-gradient(0deg, transparent 0 5px,#e1eef1 5px 7px); }
.path { background: #d1baa1; }
.path::after { content: ""; width: 100%; height: 14%; background: repeating-linear-gradient(90deg,#8a684b 0 7px,transparent 7px 12px); }
.home { background: #dfb49c; }
.home::after { content: ""; width: 46%; height: 64%; background: linear-gradient(#945039 43%,#f6ddbb 43%); clip-path: polygon(50% 0,100% 40%,93% 40%,93% 100%,8% 100%,8% 40%,0 40%); }
.park { background: #9fb789; }
.park::after { content: ""; width: 24%; height: 32%; border-radius: 48%; background: #4b7854; box-shadow: 10px 4px #649265,-8px 6px #6e965d; }
.control { background: #fff9ec; border-radius: 10px; border: 1px solid var(--edge); padding: 14px; }
.palette { display: flex; flex-wrap: wrap; gap: 7px; }
.palette button { display: flex; align-items: center; gap: 6px; }
.palette button[aria-pressed="true"] { color: white; background: var(--green); border-color: var(--green); }
.chip { display: inline-block; width: 12px; height: 12px; border-radius: 2px; border: 1px solid #22291f35; }
.map-actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 13px; }
.status { color: var(--muted); margin-top: 10px; font-size: .88rem; min-height: 1em; }
.poster-surface canvas { display: block; width: 100%; height: auto; border-radius: 4px; }
.fields { display: grid; gap: 7px; }
.fields label { font-size: .88rem; font-weight: 700; margin-top: 8px; }
.fields label:first-child { margin-top: 0; }
.fields input, .fields select { min-width: 0; width: 100%; }
.download {
  margin-top: 9px; border: 1px solid var(--green); color: white; background: var(--green);
  text-align: center; text-decoration: none; padding: .65rem .75rem; border-radius: 6px;
}
.download:hover { background: #233e32; }
.footer { border-top: 1px solid var(--edge); padding: 16px 0 30px; }
@media(max-width:700px) {
  .wrap { width: calc(100% - 30px); }
  .work-grid { grid-template-columns: minmax(0,1fr); }
  .work-grid .control { grid-row: 1; }
}

</style>

</head>
<body>
<header class="site">
  <div class="wrap top">
    <a href="interface-demos.html" data-en="Aoxin Yang / Interface demos" data-zh="杨奥新 / 交互作品">Aoxin Yang / Interface demos</a>
    <button type="button" id="language" lang="zh-CN">中文</button>
  </div>
</header>
<main class="wrap">
  <header class="intro">
    <h1 data-en="Creative Workbench" data-zh="创作工作台">Creative Workbench</h1>
    <nav aria-label="Workspaces" data-aria-en="Workspaces" data-aria-zh="工作台入口">
      <a href="#map" data-en="Neighbourhood builder" data-zh="街区拼搭">Neighbourhood builder</a>
      <a href="#poster" data-en="Exhibition label" data-zh="展签设计">Exhibition label</a>
    </nav>
  </header>
  <section id="map" class="work" aria-labelledby="map-title">
    <div class="heading">
      <h2 id="map-title" data-en="Neighbourhood builder" data-zh="街区拼搭">Neighbourhood builder</h2>
      <p data-en="Pick a tile and click the map to place it." data-zh="选一个地块类型，再点击地图铺设。">Pick a tile and click the map to place it.</p>
    </div>
    <div class="work-grid">
      <div class="map-surface"><div id="board" class="board" role="group" aria-label="Editable map" data-aria-en="Editable map" data-aria-zh="可编辑街区地图"></div></div>
      <div class="control">
        <div id="palette" class="palette" role="group" aria-label="Tile types" data-aria-en="Tile types" data-aria-zh="地块类型"></div>
        <div class="map-actions">
          <button type="button" id="undo" data-en="Undo" data-zh="撤销">Undo</button>
          <button type="button" id="reset" data-en="Restore example" data-zh="恢复示例">Restore example</button>
        </div>
        <p id="map-status" class="status" role="status"></p>
      </div>
    </div>
  </section>
  <section id="poster" class="work" aria-labelledby="poster-title">
    <div class="heading">
      <h2 id="poster-title" data-en="Exhibition label" data-zh="展签设计">Exhibition label</h2>
      <p data-en="Edit the label text and choose a colour scheme. Download the design as a PNG." data-zh="改展签文字、切换配色，再把当前效果导出为 PNG。">Edit the label text and choose a colour scheme. Download the design as a PNG.</p>
    </div>
    <div class="work-grid">
      <div class="poster-surface"><canvas id="canvas" width="900" height="630" role="img" aria-label="Exhibition label preview" data-aria-en="Exhibition label preview" data-aria-zh="展签预览"></canvas></div>
      <div class="control fields">
        <label for="poster-name"><span data-en="Title" data-zh="展签标题">Title</span></label>
        <input id="poster-name" value="River sketches" maxlength="38">
        <label for="poster-caption"><span data-en="Caption" data-zh="副标题">Caption</span></label>
        <input id="poster-caption" value="A weekend at the drawing table" maxlength="55">
        <label for="poster-style"><span data-en="Palette" data-zh="配色">Palette</span></label>
        <select id="poster-style"></select>
        <a class="download" id="download" download="exhibition-label.png" data-en="Download PNG" data-zh="下载 PNG">Download PNG</a>
      </div>
    </div>
  </section>
</main>
<footer class="wrap footer"><a href="interface-demos.html" data-en="All interface demos" data-zh="全部交互作品">All interface demos</a></footer>
<script>
"use strict";

const get = id => document.getElementById(id);
let zh = new URLSearchParams(location.search).get("lang") === "zh";
const local = ([en, chinese]) => zh ? chinese : en;
const types = [
  ["ground", ["Grass", "草地"]],
  ["water", ["Water", "水面"]],
  ["path", ["Paths", "步道"]],
  ["home", ["Houses", "住宅"]],
  ["park", ["Trees", "树木"]],
];
const sample = [
  1, 1, 0, 4, 4, 0,
  0, 1, 1, 0, 3, 4,
  2, 2, 2, 2, 2, 2,
  3, 0, 1, 1, 0, 3,
  4, 3, 0, 1, 1, 0,
];
const columns = 6;
let map = [...sample];
let historyStack = [];
let brush = 2;

function button() {
  const item = document.createElement("button");
  item.type = "button";
  return item;
}

const picker = types.map(([kind], index) => {
  const item = button();
  const chip = document.createElement("span");
  chip.className = "chip " + kind;
  chip.setAttribute("aria-hidden", "true");
  const name = document.createElement("span");
  item.append(chip, name);
  item.addEventListener("click", () => {
    brush = index;
    renderMap();
  });
  get("palette").append(item);
  return item;
});

const tiles = map.map((_, index) => {
  const tile = button();
  tile.addEventListener("click", () => {
    if (map[index] === brush) return;
    historyStack.push([...map]);
    map[index] = brush;
    renderMap();
  });
  tile.addEventListener("keydown", event => {
    const directions = {ArrowLeft: -1, ArrowRight: 1, ArrowUp: -columns, ArrowDown: columns};
    if (!Object.hasOwn(directions, event.key)) return;
    event.preventDefault();
    const next = index + directions[event.key];
    tiles[next]?.focus();
  });
  get("board").append(tile);
  return tile;
});

function renderMap() {
  picker.forEach((item, index) => {
    item.lastElementChild.textContent = local(types[index][1]);
    item.setAttribute("aria-pressed", String(index === brush));
  });
  tiles.forEach((item, index) => {
    const [kind, names] = types[map[index]];
    const column = index % columns + 1;
    const row = Math.floor(index / columns) + 1;
    item.className = "tile " + kind;
    const position = local([`Row ${row}, column ${column}`, `第 ${row} 行，第 ${column} 列`]);
    item.setAttribute("aria-label", position + " · " + local(names));
  });
  const houses = map.filter(value => value === 3).length;
  get("map-status").textContent = local([`Houses on the map: ${houses}`, `地图上的住宅数：${houses}`]);
  get("undo").disabled = historyStack.length === 0;
}
get("undo").addEventListener("click", () => {
  if (!historyStack.length) return;
  map = historyStack.pop();
  renderMap();
});
get("reset").addEventListener("click", () => {
  if (map.every((item, index) => item === sample[index])) return;
  historyStack.push([...map]);
  map = [...sample];
  renderMap();
});

const palettes = [
  {names: ["River blue", "河岸蓝"], background: "#142a39", ink: "#ecf2e1", accent: "#85bbc5", shape: "#517b88"},
  {names: ["Clay red", "陶土红"], background: "#582d28", ink: "#fff2de", accent: "#f3ad92", shape: "#b36a59"},
  {names: ["Garden green", "庭院绿"], background: "#213c33", ink: "#f0f1d8", accent: "#b9d49d", shape: "#5f8c77"},
];
const canvas = get("canvas");
const context = canvas.getContext("2d");
const nameField = get("poster-name");
const caption = get("poster-caption");
const style = get("poster-style");
for (const [index] of palettes.entries()) {
  const option = document.createElement("option");
  option.value = String(index);
  style.append(option);
}

function fit(text, size, weight) {
  do {
    context.font = `${weight} ${size}px system-ui, sans-serif`;
    if (context.measureText(text).width <= 750) break;
    size -= 1;
  } while (size > 0);
}

function renderPoster() {
  const colour = palettes[Number(style.value)];
  context.fillStyle = colour.background;
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.strokeStyle = colour.accent;
  context.lineWidth = 2;
  context.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);
  context.fillStyle = colour.shape;
  context.beginPath();
  context.arc(650, 218, 113, 0, 2 * Math.PI);
  context.fill();
  context.fillStyle = colour.accent;
  context.fillRect(74, 359, 89, 4);
  const title = nameField.value.trim();
  context.fillStyle = colour.ink;
  fit(title, 98, 700);
  context.fillText(title, 74, 471);
  const subtitle = caption.value.trim();
  context.fillStyle = colour.accent;
  fit(subtitle, 34, 400);
  context.fillText(subtitle, 74, 538);
  get("download").href = canvas.toDataURL("image/png");
}

nameField.addEventListener("input", renderPoster);
caption.addEventListener("input", renderPoster);
style.addEventListener("change", renderPoster);

function renderLanguage() {
  document.documentElement.lang = zh ? "zh-CN" : "en";
  document.title = local(["Creative Workbench · Aoxin Yang", "创作工作台 · 杨奥新"]);
  document.querySelectorAll("[data-en]").forEach(node => {
    node.textContent = local([node.dataset.en, node.dataset.zh]);
  });
  document.querySelectorAll("[data-aria-en]").forEach(node => {
    node.setAttribute("aria-label", local([node.dataset.ariaEn, node.dataset.ariaZh]));
  });
  get("language").textContent = local(["中文", "English"]);
  get("language").lang = local(["zh-CN", "en"]);
  nameField.placeholder = local(["Enter a title", "输入标题"]);
  caption.placeholder = local(["Enter a caption", "输入副标题"]);
  Array.from(style.options).forEach((option, index) => {
    option.textContent = local(palettes[index].names);
  });
  document.querySelectorAll('a[href="interface-demos.html"], a[href="interface-demos.html?lang=zh"]').forEach(link => {
    link.setAttribute("href", zh ? "interface-demos.html?lang=zh" : "interface-demos.html");
  });
  renderMap();
  renderPoster();
}

get("language").addEventListener("click", () => {
  zh = !zh;
  renderLanguage();
});
renderLanguage();

</script>
</body>
</html>
