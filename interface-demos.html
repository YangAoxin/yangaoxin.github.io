<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interactive Projects · Aoxin Yang</title>
<link rel="stylesheet" href="demo-showcase.css">
<style>
:root { color-scheme:light; font:1rem/1.55 "Instrument Sans",system-ui,"PingFang SC",sans-serif; color:#20312b; background:#f7f7f1; }
* { box-sizing:border-box; }
body,h1,p { margin:0; }
.wrap { width:min(1120px,calc(100% - 52px)); margin-inline:auto; }
.site-header { border-bottom:1px solid #cbd5cb; }
.site-header .wrap,.footer { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; }
.site-header .wrap { min-height:63px; }
.site-header a,.footer a { color:#245c49; font-weight:700; text-underline-offset:3px; }
.site-header button { font:inherit; border:1px solid #cbd5cb; border-radius:6px; background:#fbfcf6; color:#245c49; padding:.45rem .65rem; cursor:pointer; }
:focus-visible { outline:2px solid #a6562d; outline-offset:3px; }
.intro { padding:clamp(25px,5vw,57px) 0 13px; }
h1 { font:700 clamp(2.65rem,6vw,5rem)/1.03 Georgia,"Songti SC",serif; letter-spacing:-.045em; }
.intro p { color:#52665a; margin-top:12px; }
.footer { padding:15px 0 30px; border-top:1px solid #cbd5cb; font-size:.87rem; color:#52665a; }
@media(max-width:630px) { .wrap { width:calc(100% - 30px); } }
</style>
<script src="demo-showcase.js" defer></script>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a id="projects" href="projects.html" data-locale-en="Aoxin Yang / Projects" data-locale-zh="杨奥新 / 作品集">Aoxin Yang / Projects</a>
    <button type="button" id="language" lang="zh-CN">中文</button>
  </div>
</header>
<main class="wrap">
  <div class="intro">
    <h1 data-locale-en="Interactive projects" data-locale-zh="交互作品">Interactive projects</h1>
    <p data-locale-en="Eleven demos for exploring data, using maps and making graphics in the browser." data-locale-zh="11 个可以亲手试用的作品，涵盖数据、地图、交互图表与创作工具。">Eleven demos for exploring data, using maps and making graphics in the browser.</p>
  </div>
  <div data-demo-showcase></div>
  <noscript>Enable JavaScript to browse the demo gallery. / 启用 JavaScript 后可浏览交互作品。</noscript>
</main>
<footer class="wrap footer">
  <span data-locale-en="Each demo starts with fictional examples." data-locale-zh="演示均使用虚构示例。">Each demo starts with fictional examples.</span>
  <a href="https://github.com/YangAoxin">GitHub ↗</a>
</footer>
<script>
"use strict";
(() => {
  const toggle = document.getElementById("language");
  const projects = document.getElementById("projects");
  let zh = new URLSearchParams(location.search).get("lang") === "zh";
  function renderLanguage() {
    document.documentElement.lang = zh ? "zh-CN" : "en";
    document.title = zh ? "交互作品 · 杨奥新" : "Interactive Projects · Aoxin Yang";
    for (const item of document.querySelectorAll("[data-locale-en]")) {
      item.textContent = zh ? item.dataset.localeZh : item.dataset.localeEn;
    }
    toggle.textContent = zh ? "English" : "中文";
    toggle.lang = zh ? "en" : "zh-CN";
    projects.href = zh ? "projects.html?lang=zh" : "projects.html";
  }
  toggle.addEventListener("click", () => {
    zh = !zh;
    const locationURL = new URL(location.href);
    if (zh) locationURL.searchParams.set("lang","zh");
    else locationURL.searchParams.delete("lang");
    history.replaceState(null,"",locationURL);
    renderLanguage();
  });
  renderLanguage();
})();
</script>
</body>
</html>
